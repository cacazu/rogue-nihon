<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>元祖ローグ — 全キャラアニメーション</title>
<style>
  :root { color-scheme: dark; font-family: system-ui,sans-serif; background: #11161d; color: #e2e7ef; }
  body { margin: 0 auto; max-width: 1100px; padding: 24px; }
  h1 { font-size: 24px; margin: 0 0 12px; }
  p { color: #afbdcc; line-height: 1.6; }
  .controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 20px 0; }
  button,select { padding: 8px 12px; font: inherit; }
  #characters { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,420px),1fr)); gap: 16px; }
  article { border: 1px solid #344052; border-radius: 10px; padding: 16px; background: #1b2430; }
  h2 { margin: 0 0 12px; font-size: 17px; }
  .states { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 5px; }
  figure { margin: 0; text-align: center; }
  canvas { width: 64px; height: auto; max-width: 100%; image-rendering: pixelated; background: #11161d; }
  figcaption { font-size: 12px; margin: 6px 0 12px; color: #bdc7d4; }
  details { border-top: 1px solid #344052; padding-top: 10px; }
  .sheet { width: 384px; height: auto; max-width: 100%; image-rendering: pixelated; display: block; margin: 12px auto; background: #11161d; }
  .reference { width: 64px; height: auto; max-width: 100%; image-rendering: pixelated; background: #11161d; }
  a { color: #91c9ff; }
</style>
<body data-rogue-gallery="manifest.json">
<h1>元祖ローグ · 全キャラアニメーション</h1>
<p id="summary">読み込み中…</p>
<p>32×32透過PNG。シートは横3コマ、縦に待機・移動・攻撃・被ダメージ。</p>
<p>各キャラの左端が元画像です。「12コマのシート」を開くと全ポーズを比較できます。</p>
<div class="controls"><button id="play">一時停止</button><label>コマ <select id="frame"><option value="auto">自動再生</option><option value="0">1</option><option value="1">2</option><option value="2">3</option></select></label><a href="manifest.json">画像manifest</a><a href="poses.json">ポーズ定義</a></div>
<main id="characters"></main>
<script type="module" src="/web/app.js"></script>
</body>
</html>
