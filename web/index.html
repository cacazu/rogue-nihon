<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Rogue</title>
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <div id="canvas-stage">
    <canvas id="rogue-canvas" tabindex="0"></canvas>
    <!-- Native text editing/IME receivers. All visible fields are drawn on Canvas. -->
    <input id="name" class="canvas-native-input" autocomplete="off" tabindex="-1">
    <input id="seed" class="canvas-native-input" type="number" inputmode="numeric" tabindex="-1">
    <input id="prompt-text" class="canvas-native-input" type="text" autocomplete="off" tabindex="-1">
    <input id="command-key" class="canvas-native-input" type="text" autocomplete="off" tabindex="-1">
  </div>
  <script src="/web/event-queue.js"></script>
  <script src="/web/tiles.js"></script>
  <script src="/web/canvas-ui.js"></script>
  <script src="/web/app.js"></script>
</body>
</html>
